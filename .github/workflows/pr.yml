name: Validate

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Permissions required for golangci-lint to push its status checks back to GitHub.
    # See https://github.com/golangci/golangci-lint-action
    permissions:
      contents: read
      pull-requests: read
      checks: write

    name: "test"
    # The machine type on which the workload is running
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#choosing-github-hosted-runners
    runs-on: ubuntu-24.04
    steps:

    # Check out the head of the main branch
    # See https://github.com/actions/checkout
    - uses: actions/checkout@v4

    # Install Java
    # See https://github.com/actions/setup-java
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Install Go
    # See https://github.com/actions/setup-go
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    # Install the Task Runner
    - name: Install Task
      uses: arduino/setup-task@v1

    - name: "Install go tools"
      run: task tools/go/install

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v2'
      with:
        version: '>= 459.0.0'
        install_components: 'cloud-firestore-emulator'

    # Validation
    - name: Try the build process
      run: task bin/all container/build

    # Test
    - name: Test
      run: task test

    - name: "Lint"
      uses: golangci/golangci-lint-action@v3
      with:
        # Pin a version that supports Go 1.25 targets. golangci-lint
        # v1.64.x (the previous "latest" used by the action) refuses
        # to lint a project whose go.mod declares `go 1.25.0` or
        # higher because v1.64 was built with Go 1.24 ("the Go
        # language version used to build golangci-lint is lower than
        # the targeted Go version"). The v1.x line was discontinued
        # after v1.64.8 (March 2025); v2.x is the actively
        # maintained line and accepts the newer targets. Pinning
        # explicitly avoids the upstream default flipping back to a
        # too-old binary in the future.
        version: v2.0.0