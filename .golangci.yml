---
# golangci-lint v2 requires the `version: "2"` schema marker.
version: "2"

linters:
  enable:
    - revive

# `issues.exclude-rules` and `issues.exclude-use-default` were removed in
# golangci-lint v2. Per-linter rules (including excludes) now live under
# `linters.settings.<linter-name>`; see
# https://golangci-lint.run/product/migration-guide/ for the new schema.
# The previous config excluded `revive: returns unexported type`; that
# warning is rare on this codebase and we'll re-add a v2-form exclude if
# it surfaces.